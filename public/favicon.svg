<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0B0D13" stroke="rgba(139, 92, 246, 0.4)" stroke-width="2"/>
  <!-- Neural graph lines -->
  <line x1="16" y1="16" x2="48" y2="48" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  <line x1="16" y1="48" x2="48" y2="16" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  <!-- K Letterform -->
  <path d="M 22 18 L 22 46 M 22 32 L 40 18 M 28 27 L 42 46" stroke="url(#grad1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Node points -->
  <circle cx="22" cy="18" r="3.5" fill="#8B5CF6" />
  <circle cx="22" cy="46" r="3.5" fill="#8B5CF6" />
  <circle cx="40" cy="18" r="3.5" fill="#06B6D4" />
  <circle cx="42" cy="46" r="3.5" fill="#06B6D4" />
  <circle cx="22" cy="32" r="2.5" fill="#F8FAFC" />
</svg>